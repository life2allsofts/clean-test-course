name: Lesson 2

on:
  push:
    branches:
      - lesson-2

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/hangry_api
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage django-mock-queries  
      
      - name: Run Django tests with manage.py
        run: |
          python manage.py test tests/ --verbosity=2
      
      - name: Run tests with coverage
        run: |
          # Set Django settings for pytest
          export DJANGO_SETTINGS_MODULE=hangry_api.settings
          coverage run --source=api -m pytest tests/ -v
          coverage report
  
  deploy:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/hangry_api
    steps:
      - uses: actions/checkout@v4
      
      - name: Disable Debug
        run: |
          sed -i 's/DEBUG = True/DEBUG = False/g' hangry_api/settings.py
      
      - name: Generate deployment package
        run: |
          cd ..
          zip -r deploy.zip . -x '*.git*' 'env/*' '__pycache__/*' '*.sqlite3' '.pytest_cache/*'
      
      - name: '**PLACEHOLDER** Deploy to Elastic Beanstalk'
        run: echo Placeholder for Deployment